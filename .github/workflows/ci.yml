---
name: CI

'on':
  pull_request:
  push:
    branches: [master, 1.x, 2.x]
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      # The reference pages are hand-written, so nothing but a comparison
      # against the real control plane can prove they still describe it. The
      # check skips when this checkout is absent — which is right for a
      # contributor's laptop and wrong for CI, hence `--strict` below.
      #
      # Pinned to the release branch rather than the default branch: these
      # pages document the released control plane, and a merge to `master`
      # ahead of a release would otherwise fail this build for describing
      # software nobody is running yet.
      - name: Check out the control plane
        uses: actions/checkout@v7.0.1
        with:
          repository: misaf/blitze-cdn-cp
          ref: 2.x
          path: control-plane
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.3'
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e '
            const version = require("./package.json").version;
            const tag = process.env.GITHUB_REF_NAME;
            if (tag !== `v${version}`) {
              throw new Error(`release tag ${tag} must equal v${version}`);
            }
          '
      - name: Install site dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Build site
        run: npm run build
      - name: Check formatting and lint
        run: |
          npm run format:check
          npm run lint
          npm run check:docs
      # Only the control plane's own dependencies; the surface check imports
      # `blitzecdn` to read its routes, models, commands, and settings, and
      # parses the documented examples with the real models.
      - name: Install the control plane
        working-directory: control-plane
        run: uv sync --frozen
      - name: Check the reference against the control plane
        env:
          BLITZE_CP_PATH: control-plane
        run: node scripts/check-api-surface.mjs --strict
      - name: Check internal links
        run: npm run check:links
      # A build that produces no search index would ship a search box that
      # silently returns nothing. The index is generated by `postbuild` into
      # public/ — which the export already copied — so it reaches out/ only via
      # scripts/copy-search-index.mjs. This is the guard on that step.
      - name: Verify search index was generated
        run: |
          test -f out/_pagefind/pagefind.js \
            || { echo "::error::Pagefind index missing"; exit 1; }
          echo "search index OK"
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser and accessibility tests
        run: npm run test:e2e

  # Publishes the static export to GitHub Pages. Only the release branch
  # publishes; pull requests and every other branch stop at `build`.
  deploy:
    if: github.ref == 'refs/heads/1.x' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # Narrower than it looks: `contents: read` is inherited from the workflow,
    # and these two are the minimum Pages deployment requires — `id-token` for
    # the OIDC token `deploy-pages` exchanges, `pages` to publish the artifact.
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Two pushes landing together would otherwise race to publish; let the
    # newer one win rather than interleaving deployments.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install site dependencies
        run: npm ci
      - id: pages
        uses: actions/configure-pages@v6
      # Both of these are read at BUILD time — they are inlined into the output,
      # and canonical tags, sitemap.xml and feed.xml are generated here. Setting
      # either at runtime would have no effect on a static export, which is why
      # this job rebuilds rather than reusing the `build` job's output.
      #
      # SITE_URL is an optional repository variable, for when a custom domain is
      # attached. Unset, this falls back to the Pages origin.
      #
      # Without a custom domain this is a GitHub Pages *project* site, served
      # from https://misaf.github.io/blitze-cdn-web rather than the root of its
      # own domain, so BASE_PATH carries the /<repo> prefix. Next uses it to
      # rewrite `next/link` hrefs and every `_next/` asset URL; an empty value
      # there would point all of them at the domain root and ship a broken,
      # unstyled site. A custom domain serves from the root and needs the
      # opposite — the prefix would then be wrong — so BASE_PATH follows
      # SITE_DOMAIN, the same variable the CNAME step below keys off, rather
      # than having to be edited by hand at the moment of switching.
      #
      # The condition is written `== '' && <value> || ''` and the order matters:
      # GitHub has no ternary, and the more natural `!= '' && '' || <value>`
      # silently collapses because an empty string is falsy and falls through to
      # the right-hand side, producing the prefix in exactly the case meant to
      # clear it.
      - name: Build site
        env:
          NEXT_PUBLIC_SITE_URL: >-
            ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
          BASE_PATH: ${{ vars.SITE_DOMAIN == '' && '/blitze-cdn-web' || '' }}
        run: npm run build
      - name: Verify search index was generated
        run: |
          test -f out/_pagefind/pagefind.js \
            || { echo "::error::Pagefind index missing"; exit 1; }
          echo "search index OK"
      # GitHub Pages needs CNAME inside the artifact to keep serving a custom
      # domain; it is not preserved across deployments otherwise.
      - name: Add CNAME
        if: vars.SITE_DOMAIN != ''
        run: echo "${{ vars.SITE_DOMAIN }}" > out/CNAME
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v5
