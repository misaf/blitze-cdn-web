---
name: CI

"on":
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      # The reference pages are generated from the two pinned sources, so this
      # step decides which versions of BlitzeCDN this site documents.
      - name: Install the documented sources
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'ansible-core>=2.21,<2.22'
          ansible-galaxy collection install -r requirements.yml \
            -p .state/collections
      - name: Install site dependencies
        run: npm ci
      # Also asserts the two pins describe one release: the edge version this
      # site documents must be the one the pinned control plane deploys.
      - name: Verify generated reference matches the pinned sources
        run: python scripts/generate_reference.py --check
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Build site
        run: npm run build
