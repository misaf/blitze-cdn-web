<!--
  The mark: the bolt the name comes from, printed on the dark half of the
  ledger, with the oxblood margin rule down the leading edge.

  Square, because nothing in this design is rounded. Ink ground rather than the
  paper stock so the mark holds its shape against both light and dark browser
  chrome, and the bolt is set in paper rather than oxblood — oxblood on ink is
  about 3.3:1, which is muddy at 16px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#151a1b"/>
  <rect width="5" height="64" fill="#a63a2e"/>
  <path d="M38 5 17 36h14l-3 23 24-34H37z" fill="#e8ebe8"/>
</svg>
